<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фитнес Абонаменти</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #000000; --card: #111111; --accent: #4da3ff; --text: #ffffff;
            --muted: #b5b5b5; --danger: #ff4d4d; --success: #33cc66; --purple: #b366ff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 100px; }
        header { background: #000; padding: 20px; text-align: center; font-weight: bold; font-size: 26px; border-bottom: 2px solid #222; color: var(--accent); }
        
        #top-bar { padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; position: sticky; top: 0; background: #000; z-index: 10; }
        .btn-top { padding: 14px; font-size: 16px; border-radius: 12px; border: 1px solid #333; cursor: pointer; font-weight: bold; text-align: center; background: #1a1a1a; color: white; }
        
        .client { display: flex; align-items: center; background: var(--card); margin: 12px; padding: 18px; border-radius: 20px; border: 1px solid #222; position: relative; }
        .photo-container { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; border: 2px solid #333; display: flex; align-items: center; justify-content: center; }
        .photo-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .status { width: 15px; height: 15px; border-radius: 50%; margin: 0 15px; }
        .active { background: var(--success); }
        .inactive { background: var(--danger); }

        .name-info { flex: 1; font-size: 22px; overflow: hidden; }
        .name-info b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .name-info small { font-size: 16px; color: var(--muted); display: block; }
        
        .remain-count { font-size: 38px; font-weight: 900; color: var(--accent); margin-left: 10px; min-width: 50px; text-align: right; }

        #addBtn { 
            position: fixed; right: 25px; bottom: 35px; width: 75px; height: 75px; 
            border-radius: 50%; background: var(--accent); color: black; 
            font-size: 50px; border: none; z-index: 100; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 20px rgba(77, 163, 255, 0.4);
        }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); overflow-y: auto; z-index: 2000; padding: 20px; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 25px; border: 1px solid #333; max-width: 500px; margin: auto; }
        
        input, button, select { width: 100%; padding: 18px; margin-top: 15px; border-radius: 12px; border: 1px solid #333; font-size: 20px; background: #1a1a1a; color: white; }
        .btn-blue { background: var(--accent); color: black; border: none; font-weight: bold; }
        .btn-green { background: var(--success); color: black; border: none; font-weight: bold; }
        .btn-purple { background: var(--purple); color: black; border: none; }
        .btn-red { background: var(--danger); color: white; border: none; }
        .btn-gray { background: #333; color: white; border: none; }

        .calc-box { background: #1a1a1a; padding: 18px; border-radius: 12px; margin-top: 15px; border-left: 5px solid var(--accent); font-size: 19px; }
        .history-item { font-size: 16px; padding: 10px; border-bottom: 1px solid #222; color: var(--muted); }
    </style>
</head>
<body>

<header>Фитнес Абонаменти</header>

<div id="top-bar">
    <div class="btn-top" onclick="exportData()">📤 Експорт</div>
    <div class="btn-top" onclick="document.getElementById('importInput').click()">📥 Импорт</div>
</div>
<input type="file" id="importInput" style="display:none" accept=".json" onchange="doImport(event)">

<div id="clientList"></div>

<button id="addBtn" onclick="openForm(null)">+</button>

<div class="modal" id="formModal">
    <div class="modal-content">
        <h3 id="formTitle">Нов Клиент</h3>
        
        <div id="nameFields">
            <label>Снимка:</label>
            <input type="file" id="pInput" accept="image/*" onchange="processImage(event)">
            <input id="nInput" placeholder="Име на клиента">
            <input id="phInput" placeholder="Телефон" type="tel">
        </div>

        <label>Пакет:</label>
        <select id="selPk" onchange="updateUI()">
            <option value="" disabled selected>Избери тренировки...</option>
            <option value='{"n":8, "p":100}'>8 тренировки - 100€</option>
            <option value='{"n":12, "p":150}'>12 тренировки - 150€</option>
            <option value='{"n":16, "p":200}'>16 тренировки - 200€</option>
        </select>

        <div id="priceBox" class="calc-box">Сума: <b>0.00€</b></div>

        <button class="btn-blue" onclick="doSave()">ЗАПАЗИ</button>
        <button class="btn-gray" onclick="closeAll()">ОТКАЗ</button>
    </div>
</div>

<div class="modal" id="profileModal">
    <div class="modal-content" id="profileContent"></div>
</div>

<script>
let clients = JSON.parse(localStorage.getItem("clients") || "[]");
let tPh = null;
let curIdx = null;

function processImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const max_size = 300;
            let width = img.width, height = img.height;
            if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
            else { if (height > max_size) { width *= max_size / height; height = max_size; } }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            tPh = canvas.toDataURL('image/jpeg', 0.7);
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

function render() {
    const list = document.getElementById("clientList");
    list.innerHTML = "";
    clients.forEach((c, i) => {
        list.innerHTML += `
            <div class="client" onclick="showProfile(${i})">
                <div class="photo-container">
                    ${c.photo ? `<img src="${c.photo}">` : `<span style="font-size:40px">👤</span>`}
                </div>
                <div class="status ${c.remaining > 0 ? 'active' : 'inactive'}"></div>
                <div class="name-info">
                    <b>${c.name}</b>
                    <small>${c.phone || 'Няма телефон'}</small>
                </div>
                <div class="remain-count">${c.remaining}</div>
            </div>`;
    });
}

function openForm(idx) {
    curIdx = idx; tPh = null;
    document.getElementById("formModal").style.display = "block";
    if (idx === null) {
        document.getElementById("formTitle").innerText = "Нов Клиент";
        document.getElementById("nameFields").style.display = "block";
        document.getElementById("nInput").value = "";
    } else {
        document.getElementById("formTitle").innerText = "Подновяване";
        document.getElementById("nameFields").style.display = "none";
    }
}

function updateUI() {
    const pkVal = document.getElementById("selPk").value;
    if (pkVal) {
        const pk = JSON.parse(pkVal);
        document.getElementById("priceBox").innerHTML = `Сума: <b>${pk.p}.00€</b>`;
    }
}

function doSave() {
    const pkVal = document.getElementById("selPk").value;
    if (!pkVal) return alert("Избери пакет!");
    const pk = JSON.parse(pkVal);

    if (curIdx === null) {
        const name = document.getElementById("nInput").value;
        if (!name) return alert("Въведи име!");
        clients.push({
            name, phone: document.getElementById("phInput").value,
            photo: tPh, total: pk.n, remaining: pk.n, history: []
        });
    } else {
        clients[curIdx].remaining = pk.n;
        clients[curIdx].history.unshift({date: Date.now(), txt: "Подновен абонамент"});
    }
    save(); closeAll();
}

function showProfile(i) {
    curIdx = i; const c = clients[i];
    const historyHTML = c.history.slice(0, 5).map(h => `<div class="history-item"><b>${new Date(h.date).toLocaleDateString('bg-BG')}</b> - ${h.txt}</div>`).join('');
    document.getElementById("profileContent").innerHTML = `
        <center>
            <div class="photo-container" style="width:120px; height:120px; margin-bottom:10px;">
                ${c.photo ? `<img src="${c.photo}">` : `<span style="font-size:60px">👤</span>`}
            </div>
            <h2>${c.name}</h2>
        </center>
        <p>Остават: <b>${c.remaining}</b> тренировки</p>
        <button class="btn-green" onclick="markTr(${i})">МАРКИРАЙ ТРЕНИРОВКА</button>
        <button class="btn-blue" onclick="openForm(${i})">ПОДНОВИ</button>
        <button class="btn-purple" onclick="viberReport(${i})">VIBER ОТЧЕТ</button>
        <button class="btn-gray" onclick="closeAll()">ЗАТВОРИ</button>
        <div style="margin-top:20px">${historyHTML}</div>
        <button class="btn-red" style="font-size:14px" onclick="del(${i})">ИЗТРИЙ КЛИЕНТ</button>
    `;
    document.getElementById("profileModal").style.display = "block";
}

function markTr(i) {
    if (clients[i].remaining <= 0) return alert("Няма тренировки!");
    clients[i].remaining--;
    clients[i].history.unshift({date: Date.now(), txt: "Тренировка"});
    save(); showProfile(i);
}

function viberReport(i) {
    const c = clients[i];
    const msg = `Карта: ${c.name}\nОстават: ${c.remaining} тренировки.`;
    window.location.href = `viber://forward?text=${encodeURIComponent(msg)}`;
}

function save() { localStorage.setItem("clients", JSON.stringify(clients)); render(); }
function closeAll() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
function del(i) { if(confirm("Изтриване?")) { clients.splice(i, 1); save(); closeAll(); } }

function exportData() {
    const blob = new Blob([JSON.stringify(clients)], {type: "application/json"});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "fitness_backup.json";
    a.click();
}

function doImport(event) {
    const reader = new FileReader();
    reader.onload = (e) => { clients = JSON.parse(e.target.result); save(); };
    reader.readAsText(event.target.files[0]);
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
</body>
</html>
